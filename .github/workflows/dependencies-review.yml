name: "Dependency Review"
on:
  pull_request:
    branches:
      - main-delight
      - main-xpla
      - "release/v0.*.x-xpla"
  merge_group:
    branches:
      - main-delight
      - main-xpla
      - "release/v0.*.x-xpla"

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
      - name: "Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: "Dependency audit"
        run: ./scripts/dep-assert.sh
      - name: "Go vulnerability check"
        id: govuln
        run: |
          make vulncheck-install

          scanner_status=0
          ./build/govulncheck ./... > govulncheck-output.txt 2>&1 || scanner_status=$?
          cat govulncheck-output.txt

          case "$scanner_status" in
            0)
              echo "No vulnerabilities found."
              exit 0
              ;;
            3)
              # Only a completed scan with findings may use the exceptions below.
              ;;
            *)
              echo "govulncheck failed with exit code $scanner_status."
              exit "$scanner_status"
              ;;
          esac

          # Extract vulnerability identifiers from the output (e.g., GO-2025-3443)
          vulnerabilities=$(grep -o 'GO-[0-9]\{4\}-[0-9]\+' govulncheck-output.txt | sort -u || true)
          if [ -z "$vulnerabilities" ]; then
            echo "govulncheck reported findings without vulnerability identifiers."
            exit 1
          fi
          echo "Detected vulnerabilities: $vulnerabilities"

          # GO-2026-5932 has no fixed release. The SDK uses deprecated OpenPGP
          # armor in crypto/armor.go for key export/import.
          # Follow the exception introduced in upstream PR #26580.
          IGNORED_VULNS="GO-2025-3443 GO-2026-5932"

          # Reject every vulnerability outside the explicit exceptions.
          for vuln in $vulnerabilities; do
            if ! echo "$IGNORED_VULNS" | grep -qw "$vuln"; then
              echo "Found vulnerability $vuln, failing..."
              exit 1
            fi
          done

          echo "Only explicitly accepted vulnerabilities present. Continuing."
